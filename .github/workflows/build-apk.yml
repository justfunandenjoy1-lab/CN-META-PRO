name: Build CN META PRO Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Universal Android APK (Debug & Signed Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK Platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Write Latest CN META PRO v4.2 Android Project & Web Assets
        run: |
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/java/com/cnstudio/metapro
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # ALWAYS write the latest embedded CN META PRO v4.2 into assets/www/index.html so old repo files never overwrite it!
          echo "" | base64 -d | gunzip > app/src/main/assets/www/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CNMetaPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cnstudio.metapro'
              compileSdk 34

              defaultConfig {
                  applicationId "com.cnstudio.metapro"
                  minSdk 21
                  targetSdk 34
                  versionCode 42
                  versionName "4.2.0"
              }

              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword "cnmeta123456"
                      keyAlias "cnmeta_key"
                      keyPassword "cnmeta123456"
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }

              splits {
                  abi {
                      enable false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.cnstudio.metapro">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="CN META PRO"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <external-files-path name="app_files" path="." />
              <cache-path name="cache_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#070C1B" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#22D3EE" android:pathData="M22,22h64a12,12 0 0,1 12,12v40a12,12 0 0,1 -12,12h-64a12,12 0 0,1 -12,-12v-40a12,12 0 0,1 12,-12z" />
              <path android:fillColor="#03222B" android:pathData="M34,42h14v6h-8v12h8v6h-14zM56,42h6l10,14v-14h6v24h-6l-10,-14v14h-6z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/java/com/cnstudio/metapro/MainActivity.java
          package com.cnstudio.metapro;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {

              private static final int FILE_CHOOSER_RESULT_CODE = 1001;
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  webView.clearCache(true);
                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          String[] mimeTypes = {"image/jpeg", "image/png", "image/webp", "image/svg+xml", "video/mp4", "video/quicktime", "video/webm"};
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);

                          try {
                              startActivityForResult(Intent.createChooser(intent, "Select Stock Photos or Videos"), FILE_CHOOSER_RESULT_CODE);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public boolean saveBase64File(String base64Data, String fileName, String mimeType) {
                      try {
                          byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType != null ? mimeType : "application/octet-stream");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/CN_META_PRO");

                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                      }
                                  }
                              }
                          } else {
                              File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "CN_META_PRO");
                              if (!dir.exists()) dir.mkdirs();
                              File outFile = new File(dir, fileName);
                              try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                  fos.write(bytes);
                                  fos.flush();
                              }
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads/CN_META_PRO/" + fileName, Toast.LENGTH_LONG).show());
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }
              }
          }
          EOF

      - name: Generate Release Signing Keystore (Auto-Signed APK for All Android Phones)
        run: |
          mkdir -p app
          rm -f app/release-key.jks
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -alias cnmeta_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cnmeta123456 \
            -keypass cnmeta123456 \
            -dname "CN=CN META PRO, OU=Mobile, O=CNStudio, L=Dhaka, S=Dhaka, C=BD"

      - name: Build Debug & Signed Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Prepare Output APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CN-META-PRO-v4.2-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/CN-META-PRO-v4.2-Universal-Signed.apk
          ls -lh dist/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-META-PRO-Android-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on push to main/master)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.${{ github.run_number }}
          name: "CN META PRO v4.2 (Build #${{ github.run_number }})"
          body: |
            ### CN META PRO v4.2 — Universal Android APK (Guaranteed Zero-Fail Edition)
            - **Free, Paid & Local AI APIs + Guaranteed Zero-Fail Visual Engine.**
            - **11+ Official Stock Site Rules & CSVs (Adobe Stock 100% Accepted).**
            - **Lossless IPTC/XMP JPEG Embedding & Native Android Downloads.**
          files: dist/*.apk
