      - name: Download & Auto-Bundle Official Open-Source Real-ESRGAN AI Model into APK Assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets/models
          for url in \
            "https://huggingface.co/Heliosoph/realesrgan-onnx/resolve/main/realesr-general-x4v3.onnx" \
            "https://huggingface.co/momoapps/optimix-models/resolve/main/realesr-general-x4v3.onnx" \
            "https://huggingface.co/archgod94/tellcue-models/resolve/main/realesr-general-x4v3.onnx" \
            "https://huggingface.co/OwlMaster/AllFilesRope/resolve/main/realesr-general-x4v3.onnx"; do
            echo "Downloading official Real-ESRGAN x4v3 ONNX model from $url ..."
            if curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/models/realesr-general-x4v3.onnx "$url"; then
              SIZE=$(stat -c%s app/src/main/assets/models/realesr-general-x4v3.onnx 2>/dev/null || wc -c < app/src/main/assets/models/realesr-general-x4v3.onnx)
              if [ "$SIZE" -gt 1000000 ]; then
                echo "Successfully bundled realesr-general-x4v3.onnx ($SIZE bytes) into APK assets!"
                break
              fi
            fi
          done

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Debug & Release APKs
        shell: bash
        run: |
          gradle assembleDebug assembleRelease --no-daemon --console=plain

      - name: Upload CN Upscaler v86 Real-ESRGAN Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v86-RealESRGAN-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload CN Upscaler v86 Real-ESRGAN Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v86-RealESRGAN-AI-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
