name: Build CN META PRO Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Universal Android APK (Debug & Signed Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK Platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Release Signing Keystore (Auto-Signed APK for All Android Phones)
        run: |
          rm -f app/release-key.jks
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -alias cnmeta_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cnmeta123456 \
            -keypass cnmeta123456 \
            -dname "CN=CN META PRO, OU=Mobile, O=CNStudio, L=Dhaka, S=Dhaka, C=BD"

      - name: Build Debug & Signed Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Prepare Output APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CN-META-PRO-v4.0-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/CN-META-PRO-v4.0-Universal-Signed.apk
          ls -lh dist/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-META-PRO-Android-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on push to main/master)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "CN META PRO v4.0 (Build #${{ github.run_number }})"
          body: |
            ### CN META PRO v4.0 — Universal Android APK
            - **Free, Paid & Local AI APIs:** Google Gemini, Groq, OpenRouter, Mistral, OpenAI, Claude, Ollama Local AI, LM Studio, and Offline Smart Engine.
            - **11+ Official Stock Site Rules & CSVs:** Adobe Stock, Shutterstock, Freepik, Vecteezy, Getty/iStock, Pond5, Depositphotos, Dreamstime, Alamy, 123RF, Miricanvas.
            - **Lossless IPTC/XMP JPEG Embedding & Native Android Downloads.**
            - Works on all Android 5.0 (Lollipop) to Android 15 devices.
          files: dist/*.apk
