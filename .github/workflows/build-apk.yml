name: Build CN Meta Pro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses (Direct ANDROID_HOME — No Legacy tools Error)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMGR=$(find "$ANDROID_SDK_ROOT" -name sdkmanager | head -n 1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Generate Self-Contained Android Project & Embed Latest cn_meta_pro.html
        run: |
          python3 - << 'PYEOF'
          import base64, gzip, os

          os.makedirs("android_project/app/src/main/assets/www", exist_ok=True)
          os.makedirs("android_project/app/src/main/java/com/cnmetapro/studio", exist_ok=True)
          os.makedirs("android_project/app/src/main/res/values", exist_ok=True)
          os.makedirs("android_project/app/src/main/res/xml", exist_ok=True)

          gz_b64 = ""
          html_bytes = gzip.decompress(base64.b64decode(gz_b64))
          with open("android_project/app/src/main/assets/www/index.html", "wb") as f:
              f.write(html_bytes)

          with open("android_project/settings.gradle", "w") as f:
              f.write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CNMetaPro"
          include ':app'
          ''')

          with open("android_project/build.gradle", "w") as f:
              f.write('''plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ''')

          with open("android_project/gradle.properties", "w") as f:
              f.write('''org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ''')

          with open("android_project/app/build.gradle", "w") as f:
              f.write('''plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.cnmetapro.studio'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cnmetapro.studio"
                  minSdk 24
                  targetSdk 34
                  versionCode 48
                  versionName "4.8.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ''')

          with open("android_project/app/src/main/res/values/strings.xml", "w") as f:
              f.write('''<resources>
              <string name="app_name">CN Meta Pro</string>
          </resources>''')

          with open("android_project/app/src/main/res/xml/network_security_config.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>''')

          with open("android_project/app/src/main/AndroidManifest.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:label="@string/app_name"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>''')

          with open("android_project/app/src/main/java/com/cnmetapro/studio/MainActivity.java", "w") as f:
              f.write('''package com.cnmetapro.studio;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import org.json.JSONArray;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;
              private OutputStream activeStream = null;
              private String activeFileName = "";
              private String lastPickedNamesJson = "[]";
              private Uri[] lastPickedUris = new Uri[0];

              private String queryDisplayName(Uri uri) {
                  if (uri == null) return "";
                  Cursor cursor = null;
                  try {
                      cursor = getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null);
                      if (cursor != null && cursor.moveToFirst()) {
                          int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) {
                              String name = cursor.getString(idx);
                              if (name != null && !name.trim().isEmpty()) return name.trim();
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (cursor != null) try { cursor.close(); } catch (Exception ignored) {}
                  }
                  String last = uri.getLastPathSegment();
                  return last != null ? last : "";
              }

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO}, 2001);
                      }
                  }
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          String[] mimeTypes = {"image/*", "video/*", "application/octet-stream"};
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes);
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                          startActivityForResult(Intent.createChooser(intent, "Select Stock Files"), FILE_CHOOSER_RESULT_CODE);
                          return true;
                      }
                  });
                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE && filePathCallback != null) {
                      Uri[] results = null;
                      JSONArray namesArr = new JSONArray();
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                                  namesArr.put(queryDisplayName(results[i]));
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                              namesArr.put(queryDisplayName(data.getData()));
                          }
                      }
                      lastPickedUris = results != null ? results : new Uri[0];
                      lastPickedNamesJson = namesArr.toString();
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public String getLastPickedNamesJson() {
                      return lastPickedNamesJson != null ? lastPickedNamesJson : "[]";
                  }

                  @JavascriptInterface
                  public int getPickedFileSize(int index) {
                      try {
                          if (lastPickedUris == null || index < 0 || index >= lastPickedUris.length) return -1;
                          Uri u = lastPickedUris[index];
                          try (Cursor c = getContentResolver().query(u, new String[]{OpenableColumns.SIZE}, null, null, null)) {
                              if (c != null && c.moveToFirst()) return (int) c.getLong(0);
                          }
                          try (InputStream is = getContentResolver().openInputStream(u)) {
                              if (is == null) return -1;
                              int total = 0;
                              byte[] buf = new byte[65536];
                              int r;
                              while ((r = is.read(buf)) != -1) total += r;
                              return total;
                          }
                      } catch (Exception e) {
                          return -1;
                      }
                  }

                  @JavascriptInterface
                  public String readPickedFileChunk(int index, int offset, int length) {
                      try {
                          if (lastPickedUris == null || index < 0 || index >= lastPickedUris.length) return "";
                          Uri u = lastPickedUris[index];
                          try (InputStream is = getContentResolver().openInputStream(u)) {
                              if (is == null) return "";
                              long rem = offset;
                              byte[] skipBuf = null;
                              while (rem > 0) {
                                  long s = is.skip(rem);
                                  if (s > 0) {
                                      rem -= s;
                                  } else {
                                      if (skipBuf == null) skipBuf = new byte[8192];
                                      int sr = is.read(skipBuf, 0, (int) Math.min(8192L, rem));
                                      if (sr <= 0) break;
                                      rem -= sr;
                                  }
                              }
                              byte[] out = new byte[length];
                              int got = 0;
                              while (got < length) {
                                  int r = is.read(out, got, length - got);
                                  if (r <= 0) break;
                                  got += r;
                              }
                              if (got <= 0) return "";
                              return Base64.encodeToString(out, 0, got, Base64.NO_WRAP);
                          }
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String convertPickedToJpegBase64(int index, int quality) {
                      try {
                          if (lastPickedUris == null || index < 0 || index >= lastPickedUris.length) return "";
                          Uri u = lastPickedUris[index];
                          Bitmap bmp;
                          try (InputStream is = getContentResolver().openInputStream(u)) {
                              if (is == null) return "";
                              BitmapFactory.Options opts = new BitmapFactory.Options();
                              opts.inPreferredConfig = Bitmap.Config.ARGB_8888;
                              bmp = BitmapFactory.decodeStream(is, null, opts);
                          }
                          if (bmp == null) return "";
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          int q = (quality >= 50 && quality <= 100) ? quality : 98;
                          bmp.compress(Bitmap.CompressFormat.JPEG, q, baos);
                          bmp.recycle();
                          return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean startFileSave(String fileName, String mimeType) {
                      try {
                          if (activeStream != null) try { activeStream.close(); } catch (Exception ignored) {}
                          activeFileName = fileName;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues cv = new ContentValues();
                              cv.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              cv.put(MediaStore.Downloads.MIME_TYPE, mimeType != null ? mimeType : "application/octet-stream");
                              cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/CN_Meta_Pro");
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                              if (uri != null) {
                                  activeStream = getContentResolver().openOutputStream(uri);
                                  return activeStream != null;
                              }
                          }
                          File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "CN_Meta_Pro");
                          if (!dir.exists()) dir.mkdirs();
                          activeStream = new FileOutputStream(new File(dir, fileName));
                          return true;
                      } catch (Exception e) {
                          activeStream = null;
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean appendFileChunk(String base64Chunk) {
                      try {
                          if (activeStream == null || base64Chunk == null) return false;
                          byte[] data = Base64.decode(base64Chunk, Base64.DEFAULT);
                          activeStream.write(data);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean finishFileSave(String fileName) {
                      try {
                          if (activeStream != null) {
                              activeStream.flush();
                              activeStream.close();
                              activeStream = null;
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads/CN_Meta_Pro/" + fileName, Toast.LENGTH_LONG).show());
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }
              }
          }
          ''')
          PYEOF

      - name: Build Debug & Release APKs with Gradle
        working-directory: android_project
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Upload CN Meta Pro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Meta-Pro-Android-APK
          path: |
            android_project/app/build/outputs/apk/debug/*.apk
            android_project/app/build/outputs/apk/release/*.apk
